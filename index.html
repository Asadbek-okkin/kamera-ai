<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kamera AI">
<title>Kamera AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #f3f5f9; --card: #fff; --tx: #111827; --mut: #6b7280; --ln: #e5e7eb; --ac: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #111a2e; --tx: #e5e7eb; --mut: #94a3b8; --ln: #1f2a44; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--tx); }
  header { position: sticky; top: 0; z-index: 5; background: #111827; color: #fff; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
           display: flex; align-items: center; gap: 8px; }
  header b { font-size: 17px; flex: 1; }
  main { padding: 10px 12px 90px; }
  .card { background: var(--card); border: 1px solid var(--ln); border-radius: 16px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 3px rgba(16, 24, 40, .05); }
  .card > b:first-child { font-size: 16px; }
  .kpi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi div { background: var(--card); border: 1px solid var(--ln); border-radius: 16px; padding: 14px; box-shadow: 0 1px 3px rgba(16, 24, 40, .05); }
  .kpi b { font-size: 26px; display: block; color: var(--ac); letter-spacing: -.3px; line-height: 1.2; }
  .kpi i { font-style: normal; float: right; font-size: 18px; }
  .kpi small { color: var(--mut); font-size: 13px; }
  .st { display: grid; grid-template-columns: 40% 1fr 54px; gap: 8px; align-items: center; margin: 9px 0; font-size: 14px; }
  .st span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st div { background: var(--ln); border-radius: 6px; } .st em { display: block; height: 12px; border-radius: 6px; background: var(--ac); }
  .st b { text-align: right; white-space: nowrap; }
  .sb { display: flex; gap: 4px; align-items: flex-end; height: 110px; margin-top: 10px; }
  .sb div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 10.5px; color: var(--mut); }
  .sb i { width: 100%; background: #93c5fd; border-radius: 5px 5px 2px 2px; margin-bottom: 3px; } .sb i.top { background: var(--ac); }
  .pill { background: rgba(34, 197, 94, .18); color: #bbf7d0 !important; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .kam img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: #000; display: block; }
  .kam div { font-size: 13px; padding: 4px 2px; }
  input, select, button { font: inherit; border-radius: 10px; border: 1px solid var(--ln); padding: 11px 12px; background: var(--card); color: var(--tx); width: 100%; }
  button { cursor: pointer; width: auto; }
  button.pr { background: var(--ac); color: #fff; border-color: var(--ac); width: 100%; font-weight: 600; }
  .err { color: #ef4444; margin-top: 6px; }
  .mut { color: var(--mut); font-size: 13px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--ln); display: flex;
        padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav button { flex: 1; border: 0; border-radius: 0; background: none; padding: 9px 2px 8px; font-size: 12px; color: var(--mut); }
  nav button.on { color: var(--ac); font-weight: 700; box-shadow: inset 0 3px 0 var(--ac); }
  nav span { display: block; font-size: 21px; }
  #katta { position: fixed; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; }
  #katta img, #katta video { width: 100%; flex: 1; object-fit: contain; }
  #katta .bar { color: #fff; display: flex; gap: 8px; padding: 10px; padding-top: max(10px, env(safe-area-inset-top)); align-items: center; }
  #katta .bar b { flex: 1; }
  .chip { display: inline-block; padding: 6px 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--ln); margin: 3px 3px 0 0; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } td { padding: 6px 4px; border-bottom: 1px solid var(--ln); vertical-align: top; }
</style>
</head>
<body>
<header><b>📷 Kamera AI</b><span id="hol" class="mut pill"></span></header>
<main id="app"><div class="mut">Yuklanmoqda…</div></main>
<nav id="nav" style="display:none">
  <button data-t="asosiy" onclick="tab('asosiy')"><span>📊</span>Asosiy</button>
  <button data-t="kameralar" onclick="tab('kameralar')"><span>🎥</span>Kameralar</button>
  <button data-t="izla" onclick="tab('izla')"><span>🔎</span>Qidiruv</button>
  <button data-t="xodim" onclick="tab('xodim')"><span>👷</span>Xodimlar</button>
  <button data-t="soz" onclick="tab('soz')"><span>⚙</span>Boshqa</button>
</nav>
<div id="katta"><div class="bar"><b id="kNom"></b><button id="kOv" onclick="ovozAlmash()" style="display:none">🔇</button><button id="kIj" onclick="ijroOch()">⏪ Yozuv</button><button id="kHD" onclick="hdAlmash()">HD</button><button onclick="yop()">✖</button></div>
  <div id="kIch" style="flex:1;display:flex"></div>
  <div id="ijPanel" style="display:none;color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom))">
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><b id="ijVaqt" style="flex:1"></b>
      <input type="date" id="ijKun" style="width:auto;padding:6px" onchange="ijroKun(this.value)"></div>
    <canvas id="ijChiz" height="40" style="width:100%;background:#1f2937;border-radius:6px"></canvas>
    <div style="display:flex;gap:6px;margin-top:6px"><button onclick="ijroSur(-300)" style="flex:1">−5d</button><button onclick="ijroSur(-30)" style="flex:1">−30s</button>
      <button onclick="ijroSur(30)" style="flex:1">+30s</button><button onclick="ijroSur(300)" style="flex:1">+5d</button><button onclick="katta(KIP[0],KIP[1])" style="flex:1">🔴</button></div></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const SAQ = { get: k => { try { return JSON.parse(localStorage.getItem("kai_" + k)); } catch (e) { return null; } },
              set: (k, v) => { try { localStorage.setItem("kai_" + k, JSON.stringify(v)); } catch (e) {} } };
let YO = 0;
let S = {url: null, token: null, id: null}, D = null, TAB = "asosiy", timer = null, KIP = null, HD = false;

async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function manzil(id) {  // Server ID -> joriy internet manzili (kompyuter har ishga tushganda yangilab e'lon qiladi)
  const kanal = "kai-" + (await sha("kameraai:" + id.toUpperCase())).slice(0, 24);
  const r = await fetch(`https://ntfy.sh/${kanal}/json?poll=1&since=24h`);
  const qatorlar = (await r.text()).trim().split("\n").filter(Boolean).map(x => JSON.parse(x)).filter(x => x.event === "message");
  if (!qatorlar.length) throw new Error("Server topilmadi. Server ID to'g'rimi? Kompyuter yoqiq va internetga ulanganmi?");
  // faqat https://*.trycloudflare.com; birinchi kirishdan keyin - faqat shu kompyuter kaliti bilan imzolangan e'lon
  const kalit = SAQ.get("ek_" + id.toUpperCase());
  for (const q of qatorlar.reverse()) {
    let m; try { m = JSON.parse(q.message); } catch (e) { continue; }
    if (!manzilTogri(m.url)) continue;
    if (kalit && !(await imzoTogri(kalit, m))) continue;
    return m.url;
  }
  throw new Error("Server manzili tasdiqlanmadi. Kompyuterda Kamera AI yangilanganmi?");
}
function manzilTogri(url) {
  try { const x = new URL(url); return x.protocol === "https:" && x.hostname.endsWith(".trycloudflare.com"); } catch (e) { return false; }
}
async function imzoTogri(kalitHex, m) {
  if (!m.imzo || !m.vaqt) return false;
  const bayt = new Uint8Array(kalitHex.match(/../g).map(h => parseInt(h, 16)));
  const k = await crypto.subtle.importKey("raw", bayt, {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  const im = new Uint8Array(await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(m.url + "|" + m.vaqt)));
  return [...im].map(b => b.toString(16).padStart(2, "0")).join("") === m.imzo;
}
function u(yol) { return S.url + yol + (yol.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(S.token); }
async function api(yol, body) {
  const r = await fetch(S.url + yol, {method: body ? "POST" : "GET", headers: {"Authorization": "Bearer " + S.token, "Content-Type": "application/json"},
                                      body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { SAQ.set("token", null); throw new Error("401"); }
  const d = await r.json(); if (!r.ok) throw new Error(d.xato || "xato"); return d;
}

async function boshlash() {
  if (TG) { TG.ready(); TG.expand(); }
  const p = new URLSearchParams(location.search);
  S.id = (p.get("id") || SAQ.get("id") || "").toUpperCase();
  S.token = SAQ.get("token");
  try {
    if (TG && S.id) {  // Telegram ichida - login so'ralmaydi
      S.url = await manzil(S.id);
      const r = await fetch(S.url + "/api/tg_kirish", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({initData: TG.initData})});
      const d = await r.json(); if (!r.ok) throw new Error(d.xato);
      S.token = d.token; return ishga();
    }
    if (S.id && S.token) { S.url = await manzil(S.id); await api("/api/holat"); return ishga(); }
  } catch (e) {
    if (e.message !== "401" && S.id && (S.token || TG)) return oflayn();  // kompyuter o'chiq / internet yo'q
    if (TG) return xato(e.message);
  }
  kirishOyna();
}
/* Kompyuter o'chiq bo'lsa: oxirgi saqlangan ma'lumot + kameralarni Hik-Connect (registrator buluti) orqali ko'rish */
const HIK = /iPhone|iPad/.test(navigator.userAgent) ? "https://apps.apple.com/app/hik-connect/id1087803190"
  : "intent://#Intent;package=com.connect.enduser;S.browser_fallback_url=" + encodeURIComponent("https://play.google.com/store/apps/details?id=com.connect.enduser") + ";end";
function oflayn() {
  const k = SAQ.get("kesh") || {};
  $("nav").style.display = "none";
  $("hol").textContent = "🔴 oflayn";
  $("app").innerHTML = `<div class="card" style="border-color:#ef4444">
      <b>🔴 Kamera AI kompyuteri hozir o'chiq yoki internetga ulanmagan</b>
      <div class="mut" style="margin-top:4px">Sun'iy intellekt tahlili kompyuter yoqilganda davom etadi. Kameralar va registrator yozuvlari esa ishlayapti —
      ularni hozir <b>Hik-Connect</b> orqali ko'rishingiz mumkin.</div>
      <a href="${HIK}" style="display:block;margin-top:10px"><button class="pr">📹 Kameralarni Hik-Connect'da ochish</button></a>
      <button onclick="location.reload()" style="width:100%;margin-top:8px">↻ Qayta ulanish</button></div>
    ${k.vaqt ? `<div class="card"><b>🕐 Oxirgi ma'lumot: ${esc(k.vaqt)}</b>
      <div class="kpi" style="margin-top:8px">${(k.kpi || []).map(([b, q, i]) => `<div><b>${b} ${esc(q)}</b><small>${esc(i)}</small></div>`).join("")}</div>
      <div class="grid" style="margin-top:8px">${(k.rasmlar || []).map(r => `<div class="kam"><img src="${r.src}"><div><b>${esc(r.nom)}</b> · ${esc(r.vaqt)}</div></div>`).join("")}</div>
      ${(k.xodimlar || []).length ? `<div style="margin-top:8px"><b>👷 Xodimlar:</b> ${k.xodimlar.map(x => `${esc(x.ism)} ${x.birinchi}–${x.oxirgi}`).join(", ")}</div>` : ""}</div>` : ""}`;
  clearInterval(timer); timer = setInterval(async () => { try { S.url = await manzil(S.id); await api("/api/holat"); location.reload(); } catch (e) {} }, 60000);
}
async function keshla() {  // onlayn paytda: oxirgi holat va asosiy kameralar rasmi telefonda saqlanadi
  try {
    const rasmlar = [];
    for (const ip of (D.holat.asosiy || []).slice(0, 3)) {
      const b = await (await fetch(u(`/kadr.jpg?ip=${encodeURIComponent(ip)}`))).blob();
      const src = await new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(b); });
      rasmlar.push({nom: (D.sozlama.kameralar.find(x => x.ip === ip) || {}).nom || ip, vaqt: (D.holat.vaqt || "").slice(11, 16), src});
    }
    SAQ.set("kesh", {vaqt: (D.holat.vaqt || "").slice(0, 16), kpi: D.kpi, xodimlar: (D.tahlil.xodimlar || []).slice(0, 15), rasmlar});
  } catch (e) {}
}
function xato(m) { $("app").innerHTML = `<div class="card err">⚠️ ${esc(m)}</div><button onclick="location.reload()">↻ Qayta urinish</button>`; }
function kirishOyna(xabar) {
  $("nav").style.display = "none";
  $("app").innerHTML = `<div class="card" style="margin-top:30px">
    <h2 style="margin:4px 0 6px">🔐 Kirish</h2>
    <div class="mut">Kamera AI o'rnatilgan obyektning Server ID si va sizga berilgan login/parol.</div>
    <form onsubmit="kir(event)" style="display:grid;gap:10px;margin-top:12px">
      <input id="lId" placeholder="Server ID (masalan KAI-7F3K-92QX)" value="${esc(S.id || "")}" autocapitalize="characters" required>
      <input id="lL" placeholder="Login" autocapitalize="none" autocomplete="username" required>
      <input id="lP" type="password" placeholder="Parol" autocomplete="current-password" required>
      <button class="pr">Kirish</button><div id="lX" class="err">${esc(xabar || "")}</div></form></div>` + iosMaslahat();
}
async function kir(ev) {
  ev.preventDefault();
  $("lX").textContent = "Server qidirilmoqda…";
  try {
    S.id = $("lId").value.trim().toUpperCase();
    S.url = await manzil(S.id);
    const r = await fetch(S.url + "/api/kirish", {method: "POST", headers: {"Content-Type": "application/json"},
                          body: JSON.stringify({login: $("lL").value, parol: $("lP").value})});
    const d = await r.json(); if (!r.ok) throw new Error(d.xato);
    S.token = d.token; SAQ.set("id", S.id); SAQ.set("token", S.token);
    if (d.elon_kalit) SAQ.set("ek_" + S.id.toUpperCase(), d.elon_kalit);
    ishga();
  } catch (e) { $("lX").textContent = e.message === "Failed to fetch" ? "Kompyuterga ulanib bo'lmadi — u yoqiqmi?" : e.message; }
}
function chiq() { api("/api/chiqish", {}).catch(() => {}); SAQ.set("token", null); S.token = null; kirishOyna(); }

async function ishga() {
  $("nav").style.display = "flex";
  await yangila(); tab(TAB);
  clearInterval(timer); timer = setInterval(() => { if ($("katta").style.display !== "flex") yangila().then(() => chiz(true)); }, 12000);
}
let keshVaqt = 0;
async function yangila() {
  try { D = await api("/api/holat"); }
  catch (e) {
    if (e.message === "401") return kirishOyna("Sessiya tugadi — qayta kiring");
    $("hol").textContent = "⚠️ aloqa yo'q";
    if (++YO > 3) oflayn();  // ~40 soniya aloqa yo'q - kompyuter o'chgan
    return;
  }
  YO = 0;
  yangilanishBanner();
  if (Date.now() - keshVaqt > 120000) { keshVaqt = Date.now(); keshla(); }
  const h = D.holat || {};
  $("hol").textContent = h.holat === "ishlayapti" ? "🟢 " + (h.vaqt || "").slice(11, 16) : h.holat === "pauza" ? "⏸ pauza" : "🌙";
}
function tab(t) {
  TAB = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  chiz(false);
}
function chiz(faqatYangi) {
  if (!D) return;
  const T = D.tahlil, H = D.holat || {};
  if (TAB === "asosiy") {
    $("app").innerHTML = `<div class="kpi">${(D.kpi || []).map(([b, q, i]) => `<div><i>${b}</i><b>${esc(q)}</b><small>${esc(i)}</small></div>`).join("")}</div>
      ${diqqat(T)}${xulosa(T)}
      <div class="card"><b>🎥 Hozir eng faol</b><div class="grid" style="margin-top:8px">${(H.asosiy || []).map(kamKarta).join("")}</div></div>`;
  } else if (TAB === "kameralar") {
    if (faqatYangi) { document.querySelectorAll(".kam img").forEach(i => i.src = u(`/kadr.jpg?ip=${i.dataset.ip}&t=${Date.now()}`)); return; }
    $("app").innerHTML = `<div class="mut">Bosing — katta, jonli</div><div class="grid" style="margin-top:8px">${D.sozlama.kameralar.map(k => kamKarta(k.ip)).join("")}</div>`;
  } else if (TAB === "izla") {
    if (faqatYangi) return;
    $("app").innerHTML = `<form onsubmit="izla(event)" style="display:flex;gap:6px"><input id="q" placeholder="Masalan: ${esc((D.misollar || [])[0] || "oq futbolka")}"><button class="pr" style="width:auto">🔎</button></form>
      <div>${(D.misollar || []).map(m => `<span class="chip" onclick="$('q').value='${esc(m).replace(/&#39;/g, "")}';izla()">${esc(m)}</span>`).join("")}</div><div id="natija"></div>`;
  } else if (TAB === "xodim") {
    const xs = T.xodimlar || [];
    $("app").innerHTML = `<div class="card"><b>📋 Davomat (Excel)</b><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        ${[["bugun", "Bugun"], ["hafta", "Hafta"], ["oy", "Shu oy"], ["otgan_oy", "O'tgan oy"]].map(([k, t]) => `<a href="${u("/api/davomat.xlsx?davr=" + k)}" style="flex:1"><button style="width:100%">${t}</button></a>`).join("")}</div></div>
      <div class="card"><b>👷 Xodimlar — bugun</b>${xs.length ? `<table>${xs.map(x => `<tr><td><b>${esc(x.ism)}</b><br><span class="mut">${x.birinchi}–${x.oxirgi}</span></td>
      <td>${x.bolimlar.slice(0, 3).map(b => `${esc(b.nom)} <b>${b.tashrif}×</b>`).join("<br>")}</td></tr>`).join("")}</table>` : `<div class="mut">Hali tanilgan xodim yo'q — botda 👷 Xodimlar orqali tanishtiring.</div>`}</div>`;
  } else if (TAB === "soz") {
    if (faqatYangi) return;
    const admin = D.men.rol === "admin";
    $("app").innerHTML = `<div class="card"><b>${esc(D.obyektlar[D.sozlama.obyekt]?.belgi || "")} ${esc(D.obyektlar[D.sozlama.obyekt]?.nom || "")}</b>
        <div class="mut">Server: ${esc(S.id)} · ${esc(D.men.login.replace(/^tg:.*/, "Telegram"))} (${D.men.rol === "admin" ? "admin" : "kuzatuvchi"}) · v${esc(D.versiya.nom)}</div></div>
      ${admin ? `<div class="card"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${D.sozlama.qoriqlash ? "checked" : ""} onchange="qoriq(this.checked)">
        <span>🚨 <b>Qo'riqlash</b> — ish vaqtidan tashqari odam ko'rinsa Telegramga rasm va video</span></label></div>
        ${D.mashina ? `<div class="card"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${D.mashina.yoqilgan ? "checked" : ""} onchange="nazorat('mashina', this.checked)">
          <span>🚗 <b>Mashinalar nazorati</b> — darvozadan kirgan/chiqqan mashinalar, rasm va video</span></label></div>` : ""}
        ${D.xodim_chiqish ? `<div class="card"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${D.xodim_chiqish.yoqilgan ? "checked" : ""} onchange="nazorat('xodim_chiqish', this.checked)">
          <span>🚶 <b>Xodimlar nazorati</b> — stanokdan chiqqan xodim qayerga bordi, uzoq qaytmasa xabar</span></label></div>` : ""}` : ""}
      ${D.sozlama.obyekt === "dokon" ? `<a href="${u("/api/tovarlar.xlsx?davr=oy")}"><button style="width:100%;margin-bottom:8px">🛒 Tovarlar statistikasi (Excel)</button></a>` : ""}
      <button onclick="api('/api/hisobot',{}).then(()=>alert('Telegramga yuborildi')).catch(e=>alert(e.message))" style="width:100%;margin-bottom:8px">📨 Bugungi hisobotni Telegramga</button>
      ${TG ? "" : `<button onclick="chiq()" style="width:100%">⏏ Chiqish</button>`}`;
  }
}
function diqqat(T) {  // ⚠️ faqat e'tibor kerak bo'lgan narsalar (bot xulosasidagi bilan bir xil qoida)
  if (!T) return "";
  const mi = h => +h.slice(0, 2) * 60 + +h.slice(3, 5), d = m => m >= 60 ? `${Math.floor(m / 60)} soat ${m % 60} daq` : `${m} daq`, L = [];

    if (mi(b) - mi(a) >= 30) L.push([mi(b) - mi(a), `${esc(z.nom)} <b>${d(mi(b) - mi(a))}</b> bo'sh qoldi (${a}–${b})`]);

}
function xulosa(T) {  // 📊 stanoklar qancha ishladi + qaysi soatda gavjum (kompyuter sahifasi va bot rasmi bilan bir xil)

  const eng = Math.max(1, ...st.map(z => z.harakat_daq)), mx = Math.max(1, ...Object.values(so));
  let s0 = +T.ish_vaqti[0].slice(0, 2), s1 = +T.ish_vaqti[1].slice(0, 2) - 1;
  Object.keys(so).forEach(h => { s0 = Math.min(s0, +h); s1 = Math.max(s1, +h); });
  const ust = [];
  for (let h = s0; h <= s1; h++) ust.push(`<div><i class="${so[h] === mx ? "top" : ""}" style="height:${Math.round(85 * (so[h] || 0) / mx)}px"></i>${String(h).padStart(2, "0")}</div>`);
  return (st.length ? `<div class="card"><b>⚙️ Stanoklar qancha ishladi</b>${st.map(z => `<div class="st"><span>${esc(z.nom)}</span>
